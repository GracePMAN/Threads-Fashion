<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" role="img" aria-label="THREADS NG TN monogram">
  <title>THREADS NG — TN monogram</title>
  <defs>
    <linearGradient id="tnLime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4f763"/>
      <stop offset="0.5" stop-color="#b4e63c"/>
      <stop offset="1" stop-color="#8cbf1e"/>
    </linearGradient>
  </defs>

  <!--
    LIGHT-SURFACE VARIANT of the approved TN monogram.

    The structure here is near-black (#0a0a0a) on a transparent ground, which is
    correct on cream/bone backgrounds but disappears on the app's ink-black
    surfaces. For dark surfaces use `threads-ng-mark-on-dark.svg`, which is the
    identical path geometry with an inverted (bone white) fill.
  -->

  <rect width="620" height="250" fill="none"/>

  <!-- N: drawn first so the black T sits in front of the lime diagonal -->
  <g id="tnMark">
    <!-- N left stem (black) -->
    <path d="M 196 62 L 254 62 L 254 230 L 196 230 Z" fill="#0a0a0a"/>
    <!-- N diagonal (lime) -->
    <path d="M 232 62 L 336 62 L 578 230 L 474 230 Z" fill="url(#tnLime)"/>
    <!-- N right stem (lime, curved shoulder) -->
    <path d="M 492 230 L 492 106 C 492 64 520 44 576 32 L 576 230 Z" fill="url(#tnLime)"/>

    <!-- T crossbar + stem (black with lime keyline) -->
    <path d="M 40 62 L 58 26 L 470 26 L 470 62 L 178 62 L 178 224 L 110 224 L 110 62 Z"
          fill="#0a0a0a" stroke="#b4e63c" stroke-width="2.5" stroke-linejoin="miter"/>
  </g>
</svg>